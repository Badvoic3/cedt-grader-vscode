<script>
const contestEndTime = Date.parse('')
const extraTime = 0
function checkInLoop() {
  fetch("/contests/user_check_in", { method: "POST", headers: { "X-CSRF-Token": document.querySelector("meta[name=csrf-token]").content } })
    .then((r) => r.json()).then((j) => { setTimeout(checkInLoop, 60000 + Math.random() * 2000 + 500) })
}
function updateRemainingTime() {
  const el = document.getElementById("countdown"); if (!el || isNaN(contestEndTime)) return
  el.textContent = Math.max(0, Math.floor((contestEndTime + extraTime * 1000 - Date.now()) / 1000)) + "s"
}
</script>
